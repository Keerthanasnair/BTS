{% load static %}
<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{% block title %}Bug Tracking Management System{% endblock %}</title>
        <link rel="stylesheet" href="{% static 'css/admin.css' %}">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.2/jquery.min.js"></script>   
        <link rel="stylesheet" href="https://code.ionicframework.com/ionicons/2.0.1/css/ionicons.min.css">
        
        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #f2f2f2;
                margin: 0;
                padding: 0;
            }
            .form-container {
                max-width: 600px;
                margin: 50px auto;
                background-color: #fff;
                padding: 20px;
                border-radius: 10px;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            }
            h2 {
                text-align: center;
                color: #333;
            }
            label {
                display: block;
                margin-bottom: 8px;
                font-weight: bold;
                color: #555;
            }
            select, textarea, input[type="date"], button {
                width: 100%;
                padding: 10px;
                margin-bottom: 20px;
                border: 1px solid #ccc;
                border-radius: 5px;
            }
            select, input[type="date"] {
                cursor: pointer;
            }
            button {
                background-color: #28a745;
                color: white;
                border: none;
                font-size: 16px;
                cursor: pointer;
            }
            button:hover {
                background-color: #218838;
            }
            textarea {
                resize: vertical;
            }
            footer {
            margin-top: 20px;
            font-size: 14px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
        .dashboard-container {
            display: flex;
        }
       
        .sidebar ul {
            list-style: none;
            padding: 0;
        }
        .sidebar ul li {
            margin-bottom: 15px;
        }
        .sidebar ul li a {
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
        }
        .sidebar ul li a:hover {
            color: #17a2b8;
        }
        header, footer {
            background-color: #343a40;
            color: #ffffff;
            text-align: center;
            padding: 15px 0;
        }
        header h1, footer p {
            margin: 0;
        }
        </style>
         
    </head>

    <body>
        <div class="dashboard-container">
            <div class="sidebar">
                <h3></h3>
                <ul>
                    <li><a href="{% url 'tester_home' %}">Home</a></li>
            <li><a href="{% url 'tasks_page' %}">Assigned Tasks</a></li>
            <li><a href="{% url 'tester_review_script' %}">Review Form</a></li>
            <li><a href="{% url 'tester_total' %}">Total Assigned Tasks</a></li>
            <li><a href="{% url 'tester_progress' %}">In Progress Tasks</a></li>
            <li><a href="{% url 'completed_reports' %}">Completed Reports</a></li>          
            <li><a href="{% url 'logout' %}">Logout</a></li>
        
                </ul>
            </div>
            <div class="main-content">
                <h2>Report Form</h2>
                <form id="review-form">{% csrf_token %}
                    <label for="task_id">Task ID</label>
                    <select name="task_id" id="task_id" required>
                        <option value="">Select Task ID</option>
                        {% for task in tasks %}
                            <option value="{{ task.taskid }}">{{ task.taskid }}</option>
                        {% endfor %}
                    </select>
        
                    <label for="filename">Filename</label>
                    <select name="filename" id="filename" required>
                        <option value="">Select Filename</option>
                        {% for task in tasks %}
                            <option value="{{ task.script.filename }}">{{ task.script.filename }}</option>
                        {% endfor %}
                    </select>
        
                    <label for="developer_name">Developer Name</label>
                    <select name="developer_name" id="developer_name" required>
                        <option value="">Select Developer</option>
                        {% for task in tasks %}
                            <option value="{{ task.script.devid.username }}">{{ task.script.devid.username }}</option>
                        {% endfor %}
                    </select>
        
                    <label for="priority">Bug Priority</label>
                    <select name="priority" id="priority" required>
                        <option value="">Select Priority</option>
                        <option value="none">None</option>
                        <option value="low">Low</option>
                        <option value="medium">Medium</option>
                        <option value="high">High</option>
                    </select>
        
                    <label for="description">Description</label>
                    <textarea name="description" id="description" rows="4" required></textarea>
        
                    <label for="review_date">Date</label>
                    <input type="date" name="review_date" id="review_date" required>
        
                    <button type="submit" id="submit_form">Submit Review</button>
                </form>
            </div>
            <footer>
                <p>&copy; 2024 Bug Tracking Management System. All rights reserved.</p>
            </footer>
        </div>
        
    </body>
    <script>
    $(document).ready(function(){

		 $('#review-form').submit(function(event) {
                event.preventDefault(); // Prevent form from submitting the default way
                var formData = $(this).serialize(); // Serialize form data
                console.log(formData);
                $.ajax({
                    url: "submit_report/", // Replace with your view URL
                    type: 'POST',
                    data: formData,
                    success: function(response) {
                        alert('Review submitted successfully!');
                        $('#review-form')[0].reset(); // Reset the form fields
                    },
                    error: function(xhr, status, error) {
                        alert('An error occurred while submitting the review: ' + error);
                    }
                });
            });

    });        

    </script>
</html>
